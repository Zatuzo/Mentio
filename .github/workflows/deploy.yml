name: Test & Deploy to VPS

# ── Toggle runner & deploy mode via GitHub repo Variables ─────────────────────
#
#   RUNNER_LABEL  (Variable)  — runner untuk job DEPLOY saja
#                               "self-hosted" → deploy langsung di VPS (tanpa SSH)
#                               kosong / tidak di-set → ubuntu-latest (pakai SSH fallback)
#
#   DEPLOY_MODE   (Variable)  — cara deploy setelah test pass
#                               "local" → jalankan deploy.sh langsung di VPS
#                               kosong / tidak di-set → SSH dari GitHub runner
#
#   Test job SELALU di ubuntu-latest (GitHub-hosted) — tidak membebani VPS.
#
# Untuk pindah ke VPS baru: cabut runner lama, install runner baru,
# update RUNNER_LABEL jika labelnya berbeda — selesai.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: nice -n 10 npm ci

      - name: Run tests
        run: nice -n 10 npm test

  deploy:
    needs: test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      # Checkout diperlukan agar deploy.sh yang dijalankan selalu versi terbaru.
      # Tanpa ini, bash membaca deploy.sh lama dari APP_DIR sebelum git pull selesai.
      - uses: actions/checkout@v4

      # Patch .env on VPS with secrets managed in GitHub.
      # Only updates keys that have a value set — leaves the rest untouched.
      - name: Patch .env (local)
        if: vars.DEPLOY_MODE == 'local'
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          ENV_FILE="$APP_DIR/.env"
          patch_env() {
            local key="$1" value="$2"
            [ -z "$value" ] && return
            if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
            else
              echo "${key}=${value}" >> "$ENV_FILE"
            fi
          }
          patch_env R2_ACCOUNT_ID     "$R2_ACCOUNT_ID"
          patch_env R2_ACCESS_KEY_ID  "$R2_ACCESS_KEY_ID"
          patch_env R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          patch_env R2_BUCKET_NAME    "$R2_BUCKET_NAME"
          patch_env R2_PUBLIC_URL     "$R2_PUBLIC_URL"
          echo "✓ .env patched with R2 vars"

      # Ensure local SSH key can access VPS directly (for QR scan & debugging)
      - name: Authorize local SSH key
        if: vars.DEPLOY_MODE == 'local'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJosWy2GBOo6kMmUsnUP2KvT7boB+7o5GEbWBJTFVd4x resanmekdi@gmail.com"
          grep -qxF "$KEY" ~/.ssh/authorized_keys 2>/dev/null || echo "$KEY" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          echo "✓ SSH key authorized for user: $(whoami)"

      # Local deploy — jalankan deploy.sh dari runner workspace (fresh checkout),
      # dengan working-directory ke APP_DIR agar git/npm/pm2 bekerja di production repo.
      - name: Deploy (local)
        if: vars.DEPLOY_MODE == 'local'
        working-directory: ${{ secrets.VPS_APP_DIR }}
        run: nice -n 10 bash "$GITHUB_WORKSPACE/scripts/deploy.sh"

      # SSH deploy — fallback saat pakai GitHub-hosted runner.
      # Pakai native ssh (bukan Docker action) agar kompatibel dengan semua runner.
      - name: Write SSH key
        if: vars.DEPLOY_MODE != 'local'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy (SSH)
        if: vars.DEPLOY_MODE != 'local'
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/deploy_key \
              -p ${{ secrets.VPS_PORT || 22 }} \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "cd ${{ secrets.VPS_APP_DIR }} && nice -n 10 bash scripts/deploy.sh"
